AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for Shopping Cart API and DynamoDB Backend
Globals:
  Function:
    Timeout: 10
    Runtime: nodejs18.x
    Environment:
      Variables:
        TABLE_NAME: team1
Resources:
  CartApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  DeleteFromCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeleteFromCartFunction
      Handler: index.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: team1
      Events:
        DeleteEvent:
          Type: Api
          Properties:
            Path: /deleteFromCart/user/{userId}/product/{productId}
            Method: delete
            RestApiId:
              Ref: CartApi
    Metadata:
      SamResourceId: DeleteFromCartFunction
  AddToCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AddToCartFunction
      Handler: index.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName: team1
      Events:
        AddEvent:
          Type: Api
          Properties:
            Path: /addToCart/user/{userId}/product/{productId}
            Method: post
            RestApiId:
              Ref: CartApi
    Metadata:
      SamResourceId: AddToCartFunction
  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetProductFunction
      Handler: index.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName: team1
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /product/{itemId}
            Method: get
            RestApiId:
              Ref: CartApi
    Metadata:
      SamResourceId: GetProductFunction
  GetCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetCartFunction
      Handler: index.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName: team1
      Events:
        GetEvent:
          Type: Api
          Properties:
            Path: /getCart/us
            Method: get
            RestApiId:
              Ref: CartApi
    Metadata:
      SamResourceId: GetCartFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${CartApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
