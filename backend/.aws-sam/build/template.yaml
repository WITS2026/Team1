AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Jewelry Store Website - Lambda + API Gateway + DynamoDB
Globals:
  Function:
    Runtime: nodejs22.x
    Handler: index.handler
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: team1
Resources:
  CartHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
        AllowHeaders:
        - '*'
        AllowOrigins:
        - http://localhost:5173
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/us-east-1_KnSc6dMXX
              audience:
              - 20tlbqfhrdad0tmbkg374aboeu
        DefaultAuthorizer: CognitoAuthorizer
  DeleteFromCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeleteFromCartFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName: team1
      Events:
        DeleteEvent:
          Type: HttpApi
          Properties:
            Path: /deleteFromCart/product/{productId}
            Method: delete
            ApiId:
              Ref: CartHttpApi
    Metadata:
      SamResourceId: DeleteFromCartFunction
  AddToCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AddToCartFunction
      Policies:
      - DynamoDBCrudPolicy:
          TableName: team1
      Events:
        AddEvent:
          Type: HttpApi
          Properties:
            Path: /addToCart/product/{productId}
            Method: post
            ApiId:
              Ref: CartHttpApi
    Metadata:
      SamResourceId: AddToCartFunction
  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetProductFunction
      Policies:
      - DynamoDBReadPolicy:
          TableName: team1
      Events:
        GetEvent:
          Type: HttpApi
          Properties:
            Path: /product
            Method: get
            ApiId:
              Ref: CartHttpApi
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: GetProductFunction
  GetCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetCartFunction
      Policies:
      - DynamoDBReadPolicy:
          TableName: team1
      Events:
        GetEvent:
          Type: HttpApi
          Properties:
            Path: /getCart
            Method: get
            ApiId:
              Ref: CartHttpApi
    Metadata:
      SamResourceId: GetCartFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${CartHttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  UserPoolId:
    Description: Existing Cognito User Pool ID used for auth
    Value: us-east-1_KnSc6dMXX
  UserPoolClientId:
    Description: Existing Cognito User Pool Client ID used for auth
    Value: 20tlbqfhrdad0tmbkg374aboeu
