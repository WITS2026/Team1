AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Jewelry Store Website - Lambda + API Gateway + DynamoDB

Globals:
  Function:
    Runtime: nodejs22.x
    Handler: index.handler
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: team1
        BUCKET_NAME: gemini-api-s3bucket-wk6dwra8hw94

Parameters:
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key used by the createCheckoutSession Lambda
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Signing secret for the Stripe webhook endpoint (whsec_...)
  FrontendUrl:
    Type: String
    Default: http://localhost:5173
    Description: Base URL Stripe redirects back to after checkout

Resources:
  # --- API Gateway ---
  CartHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - PUT
          - OPTIONS
        AllowHeaders:
          - "*"
        AllowOrigins:
          - http://localhost:5173
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/us-east-1_KnSc6dMXX"
              audience:
                - "20tlbqfhrdad0tmbkg374aboeu"
        DefaultAuthorizer: CognitoAuthorizer

  # --- Lambda Functions ---
  DeleteFromCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: deleteFromCart/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: team1
      Events:
        DeleteEvent:
          Type: HttpApi
          Properties:
            Path: /deleteFromCart/product/{productId}
            Method: delete
            ApiId: !Ref CartHttpApi

  AddToCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: addToCart/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: team1
      Events:
        AddEvent:
          Type: HttpApi
          Properties:
            Path: /addToCart/product/{productId}
            Method: post
            ApiId: !Ref CartHttpApi

  UpdateCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: updateCartQuantity/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: team1
      Events:
        UpdateEvent:
          Type: HttpApi
          Properties:
            Path: /updateCart/product/{productId}
            Method: put
            ApiId: !Ref CartHttpApi

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getProduct/
      Policies:
        - DynamoDBReadPolicy:
            TableName: team1
        - S3ReadPolicy:
            BucketName: gemini-api-s3bucket-wk6dwra8hw94
      Events:
        GetEvent:
          Type: HttpApi
          Properties:
            Path: /product
            Method: get
            ApiId: !Ref CartHttpApi
            Auth:
              Authorizer: NONE

  GetCartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: getCart/
      Policies:
        - DynamoDBReadPolicy:
            TableName: team1
      Events:
        GetEvent:
          Type: HttpApi
          Properties:
            Path: /getCart
            Method: get
            ApiId: !Ref CartHttpApi

  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: createCheckoutSession/
      Policies:
        - DynamoDBReadPolicy:
            TableName: team1
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrl
      Events:
        CreateCheckoutEvent:
          Type: HttpApi
          Properties:
            Path: /createCheckoutSession
            Method: post
            ApiId: !Ref CartHttpApi

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: stripeWebhook/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: team1
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Events:
        StripeWebhookEvent:
          Type: HttpApi
          Properties:
            Path: /stripeWebhook
            Method: post
            ApiId: !Ref CartHttpApi
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${CartHttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  StripeWebhookUrl:
    Description: "Register this URL as the endpoint in the Stripe Dashboard (Developers > Webhooks)"
    Value: !Sub "https://${CartHttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/stripeWebhook"

  UserPoolId:
    Description: "Existing Cognito User Pool ID used for auth"
    Value: us-east-1_KnSc6dMXX

  UserPoolClientId:
    Description: "Existing Cognito User Pool Client ID used for auth"
    Value: 20tlbqfhrdad0tmbkg374aboeu


  BucketName:
    Description: Existing S3 bucket
    Value: gemini-api-s3bucket-wk6dwra8hw94